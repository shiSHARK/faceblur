# Merged-manifest consumer build settings. No credentials here (the file is committed).
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
# The app has no code of its own: no Kotlin compilation (fewer tool downloads, faster gate).
android.builtInKotlin=false

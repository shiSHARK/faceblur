# SPDX-License-Identifier: Apache-2.0
# Minimum versions for transitive build-tool libraries with published advisories.
# Applied as version floors to the plugin classpath (root buildscript constraints) and to every configuration of
# :faceblur (lint, Dokka, ktlint, Kover, test classpaths). A floor only raises a version that is lower; it never adds
# a dependency. Nothing here is on a shipped runtime classpath (those are gated by the OSV step in CI).
# Source of the fixed versions: osv-scanner 2.7.0 over gradle/verification-metadata.xml, 2026-11-01.
# Re-check at every milestone; remove a line only when the tools themselves ship the fixed version.
# Families are raised together (same version) so that their modules stay compatible.

# Dokka (HTML generator), Android lint

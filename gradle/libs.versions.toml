# Version catalog for the FaceBlur library build.
# Pinned versions; each non-bench version was checked as the latest stable release at its primary
# repository (Maven Central / Gradle Plugin Portal maven-metadata.xml) on 2026-11-01.

[versions]
# Same as the benchmark app the library is extracted from.
kotlin = "2.4.21"
agp = "9.4.1"
onnxruntime = "1.31.0"
# ADR 0002: kotlinx-coroutines-core is an `api` dependency of commonMain (SuspendingFaceMasker in the public API).
# Latest stable on Maven Central, checked 2026-11-01.
kotlinx-coroutines = "1.11.0"
android-compileSdk = "37"
android-minSdk = "30"
# Build tooling (latest stable on 2026-11-01).
dokka = "2.2.0"
kover = "0.9.11"
ktlint-plugin = "14.2.0"
ktlint-engine = "1.8.0"
maven-publish = "0.37.0"
# Test-only floor: Robolectric 4.17 pulls guava 33.6.0-jre; HIGH advisory fixed from 33.7.2.
guava-test-floor = "33.7.2-jre"
# Android host and device tests (ST-003, ST-049). Latest stable releases on Maven Central / Google Maven, checked
# 2026-11-03.
junit4 = "4.13.2"
androidx-test-runner = "1.7.0"
androidx-test-ext-junit = "1.3.0"
# Android host tests with native graphics (real platform codecs on the JVM). Latest stable on Maven Central, checked
# 2026-11-03; same version as the benchmark app.
robolectric = "4.17"
# Robolectric's Android framework jar for @Config(sdk = [35]) under Robolectric 4.17 (its DefaultSdkProvider maps
# SDK 35 to 15 / 13954326; instrumentation i7). Fetched by Gradle and pinned in gradle/verification-metadata.xml;
# the host tests run Robolectric offline from it. Changes with every Robolectric or @Config(sdk) change.
robolectric-android-all = "15-robolectric-13954326-i7"
# JVM bytecode level for the jvm and android targets (consumers on Java 17+).
jvm-target = "17"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
onnxruntime-android = { module = "com.microsoft.onnxruntime:onnxruntime-android", version.ref = "onnxruntime" }
onnxruntime-jvm = { module = "com.microsoft.onnxruntime:onnxruntime", version.ref = "onnxruntime" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
robolectric-android-all = { module = "org.robolectric:android-all-instrumented", version.ref = "robolectric-android-all" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
android-lint = { id = "com.android.lint", version.ref = "agp" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-plugin" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }

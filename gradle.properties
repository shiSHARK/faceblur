# Project-wide Gradle settings. NEVER put credentials or signing material in this file:
# it is committed. Publishing credentials and signing keys belong in ~/.gradle/gradle.properties
# or in ORG_GRADLE_PROJECT_* environment variables (see docs/ops/RELEASING.md).
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g
android.useAndroidX=true

# Library version (SemVer). Same version for the Maven artifact, the XCFramework zip and the faceblur-swift tag.
VERSION_NAME=0.1.0

# Lets a Linux host compile (not link) the iOS klibs, so CI on ubuntu type-checks iosMain.
kotlin.native.enableKlibsCrossCompilation=true
kotlin.native.ignoreDisabledTargets=true
